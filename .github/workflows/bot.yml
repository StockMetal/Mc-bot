name: Minecraft Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
concurrency:
  group: mc-bot
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node bot.js
